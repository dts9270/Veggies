<!doctype html>
<html lang="mr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RCM Ganpati WhatsApp Center</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:system-ui,-apple-system,"Noto Sans Devanagari",Arial,sans-serif;
  background:#f4f7f5;
  color:#173127
}

.app{
  max-width:760px;
  margin:auto;
  min-height:100vh;
  background:#fff;
  padding-bottom:70px
}

.hero{
  background:linear-gradient(135deg,#07573c,#0f7c55);
  color:#fff;
  padding:16px;
  position:sticky;
  top:0;
  z-index:10
}

h1{
  font-size:20px;
  margin:0 0 4px
}

.tabs{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:12px
}

.tab{
  border:1px solid #ffffff55;
  background:#ffffff15;
  color:#fff;
  padding:11px;
  border-radius:12px;
  font-weight:800
}

.tab.active{
  background:#fff;
  color:#0a6847
}

.panel{
  display:none;
  padding:12px
}

.panel.active{
  display:block
}

.msg{
  width:100%;
  min-height:145px;
  border:1px solid #ead9a8;
  border-radius:12px;
  padding:11px;
  font-size:14px;
  line-height:1.5;
  background:#fffdf5
}

.row{
  display:flex;
  gap:8px;
  flex-wrap:wrap
}

.btn{
  border:0;
  border-radius:10px;
  padding:10px 12px;
  font-weight:800
}

.copy{
  background:#fff0c7;
  color:#725000
}

.search{
  width:100%;
  padding:12px;
  border:1px solid #dce5df;
  border-radius:12px;
  margin:10px 0
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:6px;
  margin:10px 0
}

.stat{
  background:#f7faf8;
  border:1px solid #e4ebe6;
  border-radius:12px;
  padding:8px;
  text-align:center
}

.stat b{
  display:block;
  font-size:17px;
  color:#0a6847
}

.card{
  border:1px solid #e4ebe6;
  border-radius:14px;
  padding:12px;
  margin:8px 0
}

.card.sent{
  background:#effcf3;
  border-color:#b9e5c7
}

.name{
  font-weight:850
}

.meta{
  font-size:12px;
  color:#6a786f;
  margin:4px 0 10px
}

.actions{
  display:grid;
  grid-template-columns:1fr auto;
  gap:8px;
  align-items:center
}

.phone{
  font-weight:800
}

.wa{
  border:0;
  background:#16a34a;
  color:#fff;
  border-radius:10px;
  padding:11px 14px;
  font-weight:850
}

.wa.done{
  background:#2f7651
}

.undo{
  border:1px solid #cad8cf;
  background:#fff;
  border-radius:9px;
  padding:9px;
  font-weight:700
}

.filter{
  width:100%;
  padding:11px;
  border:1px solid #dce5df;
  border-radius:12px;
  background:#fff;
  margin-bottom:6px
}

.foot{
  position:fixed;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  width:min(760px,100%);
  background:#fff;
  border-top:1px solid #e4ebe6;
  padding:8px;
  text-align:center;
  font-size:11px;
  color:#66786d
}

.empty{
  text-align:center;
  color:#75837a;
  padding:28px 8px
}
</style>
</head>

<body>

<div class="app">

<div class="hero">

<h1>🙏 RCM गणेशोत्सव WhatsApp Center</h1>

<div>
Regular + Terminated • वेगळे Messages • Sent Status Save
</div>

<div class="tabs">

<button
id="tr"
class="tab active"
onclick="sw('r')">
✅ Regular <span id="rc"></span>
</button>

<button
id="tt"
class="tab"
onclick="sw('t')">
🔁 Terminated <span id="tc"></span>
</button>

</div>
</div>


<section id="pr" class="panel active">

<textarea id="mr" class="msg"></textarea>

<div class="row">
<button class="btn copy" onclick="copyMsg('r')">
📋 Copy Message
</button>
</div>

<div class="stats">

<div class="stat">
<b id="rTotal">0</b>
Total
</div>

<div class="stat">
<b id="rSent">0</b>
Sent
</div>

<div class="stat">
<b id="rPending">0</b>
Pending
</div>

</div>

<input
id="sr"
class="search"
placeholder="नाव / नंबर / शहर शोधा..."
oninput="render('r')">

<select
id="fr"
class="filter"
onchange="render('r')">

<option value="all">All</option>
<option value="pending">Pending</option>
<option value="sent">Sent</option>

</select>

<div id="lr"></div>

</section>


<section id="pt" class="panel">

<textarea id="mt" class="msg"></textarea>

<div class="row">
<button class="btn copy" onclick="copyMsg('t')">
📋 Copy Message
</button>
</div>

<div class="stats">

<div class="stat">
<b id="tTotal">0</b>
Total
</div>

<div class="stat">
<b id="tSent">0</b>
Sent
</div>

<div class="stat">
<b id="tPending">0</b>
Pending
</div>

</div>

<input
id="st"
class="search"
placeholder="नाव / नंबर / शहर शोधा..."
oninput="render('t')">

<select
id="ft"
class="filter"
onchange="render('t')">

<option value="all">All</option>
<option value="pending">Pending</option>
<option value="sent">Sent</option>

</select>

<div id="lt"></div>

</section>


<div class="foot">
DS WORLD • Sent status या browser/device मध्ये save राहतो.
</div>

</div>

};


let D={
r:[],
t:[]
};


let sent=JSON.parse(
localStorage.getItem('dsw_sent_v2')||'{}'
);


let msgs=JSON.parse(
localStorage.getItem('dsw_msg_v2')||'{}'
);


/* =========================
   DECOMPRESS CONTACT DATA
   ========================= */

async function ungzip(b64){

let bin=Uint8Array.from(
atob(b64),
c=>c.charCodeAt(0)
);

let ds=
new DecompressionStream('gzip');

return JSON.parse(
await new Response(
new Blob([bin])
.stream()
.pipeThrough(ds)
).text()
);

}


/* =========================
   HELPER FUNCTIONS
   ========================= */

function clean(v){

let n=
String(v||'')
.replace(/\D/g,'');

if(
n.length===12 &&
n.startsWith('91')
){
n=n.slice(2);
}

return n.slice(-10);

}


function k(x,c){
return x+'_'+c.id;
}


function save(){

localStorage.setItem(
'dsw_sent_v2',
JSON.stringify(sent)
);

}


function saveMsg(){

localStorage.setItem(
'dsw_msg_v2',
JSON.stringify(msgs)
);

}


function esc(s){

return String(s??'')
.replace(
/[&<>"']/g,
m=>({
'&':'&amp;',
'<':'&lt;',
'>':'&gt;',
'"':'&quot;',
"'":'&#39;'
}[m])
);

}


/* =========================
   TAB SWITCH
   ========================= */

function sw(x){

tr.classList.toggle(
'active',
x==='r'
);

tt.classList.toggle(
'active',
x==='t'
);

pr.classList.toggle(
'active',
x==='r'
);

pt.classList.toggle(
'active',
x==='t'
);

render(x);

}


/* =========================
   COPY MESSAGE
   ========================= */

function copyMsg(x){

navigator.clipboard
.writeText(
document.getElementById(
'm'+x
).value
)
.then(
()=>alert('Message copy झाला.')
);

}


/* =========================
   SEND WHATSAPP
   ========================= */

function send(x,id){

let c=
D[x].find(
a=>String(a.id)===String(id)
);

if(!c)return;


let p=
clean(c.mobile);


if(p.length!==10){

return alert(
'Valid mobile number नाही.'
);

}


/* Sent Status Save */

sent[k(x,c)]={
at:new Date().toISOString()
};

save();

render(x);


/* Open WhatsApp */

window.open(
'https://wa.me/91'
+p+
'?text='+
encodeURIComponent(
document
.getElementById('m'+x)
.value
.trim()
),
'_blank'
);

}


/* =========================
   UNDO SENT
   ========================= */

function undo(x,id){

let c=
D[x].find(
a=>String(a.id)===String(id)
);

delete sent[k(x,c)];

save();

render(x);

}


/* =========================
   RENDER CONTACT LIST
   ========================= */

function render(x){

let a=D[x];

let q=
document
.getElementById('s'+x)
.value
.toLowerCase()
.trim();


let f=
document
.getElementById('f'+x)
.value;


let sn=
a.filter(
c=>sent[k(x,c)]
).length;


/* Stats */

document
.getElementById(x+'Total')
.textContent=a.length;

document
.getElementById(x+'Sent')
.textContent=sn;

document
.getElementById(x+'Pending')
.textContent=
a.length-sn;


document
.getElementById(
x==='r'
?'rc'
:'tc'
)
.textContent=
'('+a.length+')';


/* Filter */

let z=
a.filter(c=>{

let s=
!!sent[k(x,c)];

if(
f==='sent' &&
!s
)return false;

if(
f==='pending' &&
s
)return false;


return !q ||

[
c.name,
c.mobile,
c.city,
c.reason,
c.id
]
.join(' ')
.toLowerCase()
.includes(q);

});


/* Cards */

document
.getElementById('l'+x)
.innerHTML=

z.map(c=>{

let s=
!!sent[k(x,c)];

let p=
clean(c.mobile);


return `

<div class="card ${s?'sent':''}">

<div class="name">
${esc(c.name||'No Name')}
</div>

<div class="meta">

ID: ${esc(c.id)}

•

${esc(c.city||'')}

${
x==='t' && c.reason
?
' • '+esc(c.reason)
:
''
}

</div>


<div class="actions">

<div class="phone">
📱 ${esc(p||c.mobile)}
</div>


<div class="row">

<button
class="wa ${s?'done':''}"
onclick="send('${x}','${esc(c.id)}')">

${
s
?
'✓ Sent / Send Again'
:
'WhatsApp'
}

</button>


${
s
?
`
<button
class="undo"
onclick="undo('${x}','${esc(c.id)}')">
Undo
</button>
`
:
''
}

</div>

</div>

</div>

`;

}).join('')

||

'<div class="empty">Contact सापडला नाही.</div>';

}

   START APP
   ========================= */

(async()=>{

D.r=
await ungzip(R);

D.t=
await ungzip(T);


/* Load Saved Messages */

mr.value=
msgs.r||DEF.r;

msgs.t||DEF.t;

msgs.r=mr.value;

saveMsg();

/* Show Lists */

render('r');

render('t');
